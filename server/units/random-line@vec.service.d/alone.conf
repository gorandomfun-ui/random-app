# The fingerprints' line loads a 700 MB model on a 969 MB machine: the
# template's 700 MB ceiling made the kernel swap the model as it loaded and
# the pass wrote nothing in twenty minutes (2 October). This line gets the
# room — it runs alone, holding the dig's, the drift's and the previews' locks
# (server/run-line.sh) — and a start limit that covers waiting for those locks
# plus the twelve-minute pass. TimeoutStartSec, not RuntimeMaxSec: systemd
# ignores the latter for a oneshot service.
[Service]
MemoryMax=900M
TimeoutStartSec=3300
