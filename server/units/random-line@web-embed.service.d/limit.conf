# The night's site check once waited thirty-nine hours on a database reply that
# never came, holding its lock: the next nights never ran (4 October). The
# script now ends itself (RANDOM_WEB_EMBED_MINUTES, 75) and bounds each question;
# this is the unit's own limit behind it. TimeoutStartSec, not RuntimeMaxSec:
# systemd ignores the latter for a oneshot service.
[Service]
TimeoutStartSec=5400
