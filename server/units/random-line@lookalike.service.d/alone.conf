# The look-alikes' line loads the same 700 MB model as the fingerprints', on a
# 969 MB machine: the template's 700 MB ceiling would have the kernel swap the
# model as it loads (2 October, the fingerprints). The room, and a start limit
# that covers waiting for the dig's, the drift's and the previews' locks plus
# the thirty-minute window (server/run-line.sh). TimeoutStartSec, not
# RuntimeMaxSec: systemd ignores the latter for a oneshot service.
[Service]
MemoryMax=900M
TimeoutStartSec=4500
