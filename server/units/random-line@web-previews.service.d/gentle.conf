# The preview line drives Chromium on an e2-micro: it gives way to every other
# line (CPU weight, niceness), stays inside its memory, and never runs past a
# pass of twenty minutes plus the margin to close the browser.
# TimeoutStartSec, not RuntimeMaxSec: systemd ignores the latter for a oneshot
# service (it says so in the journal), so the template's limit never applied.
[Service]
TimeoutStartSec=1560
Nice=15
CPUWeight=20
IOWeight=20
MemoryMax=650M
