name: Daily Auto Ingest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without inserting content"
        required: false
        default: "false"
      profile:
        description: "Run profile: auto, morning, evening"
        required: false
        default: "auto"
  schedule:
    # Europe/Amsterdam rough local times: 09:10 and 21:10.
    # YouTube quota resets at midnight Pacific, around 09:00 in France/Amsterdam.
    - cron: "10 7 * 4-10 *"
    - cron: "10 8 * 1-3,11-12 *"
    - cron: "10 19 * 4-10 *"
    - cron: "10 20 * 1-3,11-12 *"

jobs:
  daily-auto-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run daily auto ingest
        env:
          RANDOM_INGEST_HOST: ${{ secrets.RANDOM_INGEST_HOST }}
          ADMIN_INGEST_KEY: ${{ secrets.ADMIN_INGEST_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DAILY_AUTO_PROFILE: ${{ github.event.inputs.profile || 'auto' }}
          DAILY_AUTO_MIN_VIDEO_INSERTED: ${{ vars.DAILY_AUTO_MIN_VIDEO_INSERTED || '600' }}
          DAILY_AUTO_MAX_VIDEO_CHUNKS: ${{ vars.DAILY_AUTO_MAX_VIDEO_CHUNKS || '24' }}
          DAILY_AUTO_MAX_RUNTIME_MINUTES: ${{ vars.DAILY_AUTO_MAX_RUNTIME_MINUTES || '110' }}
          DAILY_AUTO_CONTINUE_CHUNK_INSERTED: ${{ vars.DAILY_AUTO_CONTINUE_CHUNK_INSERTED || '20' }}
          DAILY_AUTO_WEB_COUNT: ${{ vars.DAILY_AUTO_WEB_COUNT || '8' }}
          DAILY_AUTO_WEB_PER: ${{ vars.DAILY_AUTO_WEB_PER || '10' }}
          DAILY_AUTO_WEB_PAGES: ${{ vars.DAILY_AUTO_WEB_PAGES || '3' }}
          DAILY_AUTO_ENRICH_LIMIT: "0"
        run: node scripts/daily-auto-ingest.mjs
