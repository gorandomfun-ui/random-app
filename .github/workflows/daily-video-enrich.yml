name: Daily Video Enrich

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without updating content"
        required: false
        default: "false"
      rounds:
        description: "Number of small enrich batches"
        required: false
        default: "10"
      limit:
        description: "Videos per batch"
        required: false
        default: "50"
  # The schedules moved to the ingestion server (systemd timers, server/units): GitHub keeps the manual trigger only.

jobs:
  daily-video-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run daily video enrich
        env:
          RANDOM_INGEST_HOST: ${{ secrets.RANDOM_INGEST_HOST }}
          ADMIN_INGEST_KEY: ${{ secrets.ADMIN_INGEST_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DAILY_ENRICH_ROUNDS: ${{ github.event.inputs.rounds || vars.DAILY_ENRICH_ROUNDS || '10' }}
          DAILY_ENRICH_LIMIT: ${{ github.event.inputs.limit || vars.DAILY_ENRICH_LIMIT || '50' }}
          DAILY_ENRICH_DAYS: ${{ vars.DAILY_ENRICH_DAYS || '3' }}
          DAILY_ENRICH_PAUSE_MS: ${{ vars.DAILY_ENRICH_PAUSE_MS || '1000' }}
        run: node scripts/daily-video-enrich.mjs
