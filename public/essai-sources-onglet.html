<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Essai sources : Onglet</title>
  <!-- The owner's test of 20 October (public/essai-sources.js): one of three ways to show a content's source. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Tomorrow:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #191916; color: #F8F5E6; font: 15px/1.4 "Inter Tight", -apple-system, sans-serif; }
    header { padding: 16px 16px 4px; max-width: 560px; margin: 0 auto; }
    header h1 { font: 700 20px/1.2 "Tomorrow", sans-serif; margin: 0 0 6px; }
    header p { margin: 0 0 10px; color: #cfcab9; font-size: 14px; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    nav a { color: #F8F5E6; border: 1px solid rgba(248,245,230,.4); border-radius: 999px; padding: 5px 12px; font-size: 13px; text-decoration: none; }
    nav a.on { background: #F8F5E6; color: #191916; }
    #screens { max-width: 560px; margin: 0 auto; padding: 8px 16px 40px; }
    .screen { margin: 26px 0 40px; }
    .bar { height: 40px; background: var(--c); display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; }
    .bar > img { width: 20px; height: 20px; }
    .bar .label { font: 600 17px/1 "Inter Tight", sans-serif; text-transform: uppercase; letter-spacing: .02em; color: #F8F5E6; }
    .frame { position: relative; margin-top: 2px; width: 100%; aspect-ratio: 4 / 5; background: #000; overflow: hidden; }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .frame.gif img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .frame.web { display: flex; align-items: center; justify-content: center; background: #0d0d0c; text-align: center; }
    .frame.web .dom { display: block; font: 700 28px/1.1 "Tomorrow", sans-serif; }
    .frame.web .hint { display: block; margin-top: 8px; color: #9c968a; font-size: 13px; }
    .frame.fact { display: flex; align-items: center; padding: 28px; background: #121210; }
    .frame.fact p { margin: 0; font: 700 22px/1.35 "Tomorrow", sans-serif; }
    .frame.bili .blur { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(6px) brightness(.9); transform: scale(1.06); }
    .frame.bili iframe { top: 50%; bottom: auto; height: auto; aspect-ratio: 16 / 9; transform: translateY(-50%); }
    .frame.bili .poster { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); aspect-ratio: 16 / 9; cursor: pointer; transition: opacity .25s; }
    .frame.bili .poster.through { pointer-events: none; }
    .frame.bili .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .frame.bili .poster .play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(18,18,16,.72); border: 2px solid #F8F5E6; }
    .frame.bili .poster .play::after { content: ""; position: absolute; left: 25px; top: 19px; border-left: 20px solid #F8F5E6; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
    .frame.bili .poster.gone { opacity: 0; pointer-events: none; }
    .way { margin: 12px 0 4px; font: 600 13px/1.3 "Inter Tight", sans-serif; color: var(--c); text-transform: uppercase; letter-spacing: .06em; }
    .log { margin: 6px 0 0; font-size: 13px; color: #cfcab9; min-height: 18px; }
    .spare { margin-top: 6px; background: none; border: 1px solid rgba(248,245,230,.4); color: #F8F5E6; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; padding: 0 6px; }
    .actions .heart, .actions .share { width: 30px; height: 30px; }
    .actions .encore { flex: 1; max-width: 300px; height: 48px; border-radius: 999px; background: var(--c); color: #F8F5E6; display: flex; align-items: center; justify-content: center; font: 700 18px/1 "Tomorrow", sans-serif; letter-spacing: .12em; }
    a { color: inherit; }
    /* Bandeau: Giphy's band for every content. */
    .src.bandeau { height: 44px; margin-top: 2px; background: #121210; display: flex; align-items: center; gap: 10px; padding-right: 12px; }
    .src.bandeau .rule { align-self: stretch; width: 3px; background: var(--c); flex: none; }
    .src.bandeau svg, .src.bandeau img:not(.badge) { flex: none; }
    .src.bandeau .badge { height: 26px; flex: none; }
    .src.bandeau .title { flex: 1; min-width: 0; font: 600 15px/1 "Inter Tight", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src.bandeau .sep { color: var(--c); flex: none; }
    .src.bandeau .author { flex: none; max-width: 34%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--c); font: 600 13px/1 "Inter Tight", sans-serif; }
    .src .open { flex: none; text-decoration: none; opacity: .8; font-size: 18px; }
    /* Légende: the title first, in the site's own letters, with a quiet line under it. */
    .src.legende { padding: 10px 2px 0; }
    .src.legende .scan { height: 1px; background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 10px); opacity: .75; margin-bottom: 9px; }
    .src.legende .title { position: relative; font: 700 17px/1.28 "Tomorrow", sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.56em; }
    .src.legende .meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; height: 18px; color: var(--c); font: 600 11.5px/1 "Inter Tight", sans-serif; text-transform: uppercase; letter-spacing: .09em; }
    .src.legende .meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .src.legende .meta .open { margin-left: auto; color: #F8F5E6; font-size: 16px; }
    .src.legende .badge.small { height: 18px; }
    .glitch.run { animation: slice .26s steps(2, end) 1; }
    @keyframes slice {
      0% { clip-path: inset(0 0 55% 0); transform: translateX(-6px); color: var(--c); }
      35% { clip-path: inset(40% 0 20% 0); transform: translateX(5px); }
      70% { clip-path: inset(70% 0 0 0); transform: translateX(-3px); }
      100% { clip-path: inset(0 0 0 0); transform: none; color: #F8F5E6; }
    }
    /* Onglet: the platform and its author in the bar's cream box, the title alone under the picture. */
    .bar .tab { position: absolute; right: 6px; top: 6px; bottom: 6px; max-width: 48%; display: flex; align-items: center; gap: 6px; padding: 0 9px; background: #F8F5E6; color: #191916; font: 600 12px/1 "Inter Tight", sans-serif; }
    .bar .tab .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar .tab.giphy { background: #000; padding: 0 6px; }
    .bar .tab .badge { height: 20px; }
    .src.onglet { padding: 10px 6px 0; text-align: center; font: 500 15px/1.35 "Inter Tight", sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.1em; }
    .src.onglet a { text-decoration: none; }
    @media (min-width: 700px) { .frame { aspect-ratio: 16 / 10; } }
</style>
</head>
<body>
  <header>
    <h1>Essai sources : Onglet</h1>
    <p>Le logo et l’auteur montent dans la case crème de la barre de couleur ; sous l’image, seulement le titre.</p>
    <nav><a href="/essai-sources-bandeau.html">Bandeau</a> <a href="/essai-sources-legende.html">Légende</a> <a href="/essai-sources-onglet.html" class="on">Onglet</a></nav>
    
  </header>
  <main id="screens"></main>
  <script src="/essai-sources.js"></script>
  <script>renderEssai('onglet')</script>
</body>
</html>
