<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Erase Obsolete Videos</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 32px;
        background: #f6f6f6;
        color: #111;
      }
      h1 {
        margin-bottom: 8px;
        font-size: 28px;
      }
      p.description {
        max-width: 720px;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }
      label.input {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
      }
      label.input input {
        width: 80px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button.primary {
        background: #1f7aec;
        color: #fff;
      }
      button.danger {
        background: #e04646;
        color: #fff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        font-size: 14px;
        margin-bottom: 12px;
        min-height: 20px;
      }
      .summary {
        background: #fafafa;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid #ececec;
      }
      .summary strong {
        font-size: 15px;
      }
      .summary-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-top: 12px;
        padding-left: 0;
        list-style: none;
        font-size: 14px;
      }
      .video-list {
        display: grid;
        gap: 10px;
        max-height: 55vh;
        overflow-y: auto;
      }
      details.video-item {
        background: #fff;
        border-radius: 10px;
        border: 1px solid #e3e3e3;
        padding: 12px 14px;
      }
      details.video-item summary {
        cursor: pointer;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      details.video-item summary span.meta {
        display: inline-flex;
        gap: 12px;
        font-size: 13px;
        font-weight: 500;
        color: #5a5a5a;
      }
      details.video-item .body {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.45;
      }
      details.video-item a {
        color: #1f7aec;
        word-break: break-all;
      }
      .hidden {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1215;
          color: #f1f1f1;
        }
        .card {
          background: #171a1f;
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
        label.input input {
          background: #0f1215;
          color: #f1f1f1;
          border-color: #2a2d33;
        }
        .summary {
          background: #161a1f;
          border-color: #22272f;
        }
        details.video-item {
          background: #161a1f;
          border-color: #232831;
        }
        details.video-item summary span.meta {
          color: #b7bcc5;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Erase Obsolete Videos</h1>
      <p class="description">
        Scan the <code>items</code> collection for videos that look unavailable (404, removed, dead links).
        The tool now sweeps the full catalog in one go so you always get an up-to-date obsolete list.
      </p>

      <div class="controls">
        <button id="scanBtn" class="primary" type="button">Scan all videos</button>
        <button id="deleteBtn" class="danger" type="button" disabled>Delete obsolete videos</button>
      </div>

      <div id="status" class="status"></div>
      <div id="summary" class="summary hidden"></div>
      <div id="list" class="video-list"></div>
    </main>

    <script type="module">
      const statusEl = document.getElementById('status')
      const summaryEl = document.getElementById('summary')
      const listEl = document.getElementById('list')
      const scanBtn = document.getElementById('scanBtn')
      const deleteBtn = document.getElementById('deleteBtn')

      let adminKey = ''
      let busy = false
      let lastResult = null

      const storedKey = localStorage.getItem('local-ingest-key') || ''
      adminKey = storedKey || window.prompt('Admin ingest key', '') || ''
      if (adminKey) {
        localStorage.setItem('local-ingest-key', adminKey)
      }
      document.body.dataset.key = adminKey

      function setBusy(state) {
        busy = state
        scanBtn.disabled = state
        deleteBtn.disabled = state || !(lastResult && lastResult.obsolete && lastResult.obsolete.length)
        if (state) {
          statusEl.textContent = 'Scanning…'
        }
      }

      function renderSummary(data) {
        if (!data) {
          summaryEl.classList.add('hidden')
          summaryEl.innerHTML = ''
          return
        }
        summaryEl.classList.remove('hidden')
        const total = data.counts?.total || 0
        const providers = data.counts?.providers || {}
        const providerEntries = Object.entries(providers)
        const duration =
          typeof data.durationMs === 'number'
            ? (data.durationMs / 1000).toFixed(data.durationMs >= 10000 ? 0 : 1)
            : null
        summaryEl.innerHTML = `
          <div>
            <strong>Checked:</strong> ${data.checked}
            ${data.errors ? `• <strong>Errors:</strong> ${data.errors}` : ''}
            • <strong>Obsolete:</strong> ${total}
          </div>
          ${
            duration
              ? `<div><strong>Duration:</strong> ${duration}s</div>`
              : ''
          }
          ${providerEntries.length
            ? `<ul class="summary-list">${providerEntries
                .map(([name, value]) => `<li><strong>${name}</strong>: ${value}</li>`)
                .join('')}</ul>`
            : '<p>No obsolete videos detected.</p>'}
        `
      }

      function renderList(data) {
        if (!data?.obsolete?.length) {
          listEl.innerHTML = ''
          return
        }
        const items = data.obsolete
          .map((item) => {
            const safeReason = item.reason ? item.reason.replace(/</g, '&lt;') : 'unknown'
            const safeTitle = item.title ? item.title.replace(/</g, '&lt;') : ''
            const urlLink = item.url
              ? `<a href="${item.url}" target="_blank" rel="noreferrer">${item.url}</a>`
              : '<em>No URL</em>'
            const videoId = item.videoId ? `<div>videoId: <code>${item.videoId}</code></div>` : ''
            const status = item.status != null ? `<div>Status: ${item.status}</div>` : ''
            const titleLine = safeTitle ? `<div>Title: ${safeTitle}</div>` : ''
            return `
              <details class="video-item">
                <summary>
                  <span>${item.provider}</span>
                  <span class="meta">
                    <span>${safeReason}</span>
                    ${item.status != null ? `<span>${item.status}</span>` : ''}
                  </span>
                </summary>
                <div class="body">
                  <div>ID: <code>${item.id}</code></div>
                  ${titleLine}
                  ${videoId}
                  ${status}
                  <div style="margin-top:6px;">${urlLink}</div>
                </div>
              </details>
            `
          })
          .join('')
        listEl.innerHTML = items
      }

      async function scanVideos() {
        if (!adminKey) {
          alert('Missing admin ingest key.')
          return
        }
        setBusy(true)
        lastResult = null
        summaryEl.classList.add('hidden')
        listEl.innerHTML = ''
        try {
          const res = await fetch(`/api/tools/videos/obsolete?full=1`, {
            method: 'GET',
            headers: { 'x-admin-ingest-key': adminKey },
          })
          if (!res.ok) {
            const data = await res.json().catch(() => ({}))
            throw new Error(data?.error || res.statusText)
          }
          if (!res.body) {
            throw new Error('Streaming response not available.')
          }

          const reader = res.body.getReader()
          const decoder = new TextDecoder()
          let buffer = ''
          let completed = false

          while (true) {
            const { value, done } = await reader.read()
            if (done) break
            buffer += decoder.decode(value, { stream: true })
            let newlineIndex = buffer.indexOf('\n')
            while (newlineIndex !== -1) {
              const line = buffer.slice(0, newlineIndex).trim()
              buffer = buffer.slice(newlineIndex + 1)
              if (line) {
                const payload = JSON.parse(line)
                if (payload.type === 'progress') {
                  const progressMessage =
                    payload.errors && payload.errors > 0
                      ? `Scanning… ${payload.checked} checked (${payload.errors} errors)`
                      : `Scanning… ${payload.checked} checked`
                  statusEl.textContent = progressMessage
                } else if (payload.type === 'done') {
                  completed = true
                  const result = {
                    checked: payload.checked || 0,
                    errors: payload.errors || 0,
                    durationMs: payload.durationMs || 0,
                    obsolete: Array.isArray(payload.obsolete) ? payload.obsolete : [],
                    counts: payload.counts || { total: 0, providers: {} },
                  }
                  lastResult = result
                  renderSummary(result)
                  renderList(result)
                  deleteBtn.disabled = !(result.obsolete.length)
                  statusEl.textContent = result.obsolete.length
                    ? `Done. ${result.obsolete.length} obsolete video${result.obsolete.length > 1 ? 's' : ''} detected.`
                    : 'Done. No obsolete videos detected.'
                  await reader.cancel()
                  break
                } else if (payload.type === 'error') {
                  throw new Error(payload.message || 'Scan failed.')
                }
              }
              newlineIndex = buffer.indexOf('\n')
            }
            if (completed) break
          }

          if (!completed) {
            const remainder = buffer + decoder.decode()
            const trimmed = remainder.trim()
            if (trimmed) {
              try {
                const payload = JSON.parse(trimmed)
                if (payload.type === 'done') {
                  const result = {
                    checked: payload.checked || 0,
                    errors: payload.errors || 0,
                    durationMs: payload.durationMs || 0,
                    obsolete: Array.isArray(payload.obsolete) ? payload.obsolete : [],
                    counts: payload.counts || { total: 0, providers: {} },
                  }
                  lastResult = result
                  renderSummary(result)
                  renderList(result)
                  deleteBtn.disabled = !(result.obsolete.length)
                  statusEl.textContent = result.obsolete.length
                    ? `Done. ${result.obsolete.length} obsolete video${result.obsolete.length > 1 ? 's' : ''} detected.`
                    : 'Done. No obsolete videos detected.'
                } else if (payload.type === 'error') {
                  throw new Error(payload.message || 'Scan failed.')
                }
              } catch (error) {
                console.warn('Failed to parse trailing payload', error)
              }
            }
          }

          if (!lastResult) {
            throw new Error('Scan finished without a result.')
          }
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Error: ${message}`
          lastResult = null
          summaryEl.classList.add('hidden')
          listEl.innerHTML = ''
          deleteBtn.disabled = true
        } finally {
          setBusy(false)
        }
      }

      async function deleteVideos() {
        if (!lastResult?.obsolete?.length) return
        if (!adminKey) {
          alert('Missing admin ingest key.')
          return
        }
        const count = lastResult.obsolete.length
        const confirmMessage = `Delete ${count} video${count > 1 ? 's' : ''}? This cannot be undone.`
        if (!window.confirm(confirmMessage)) return

        setBusy(true)
        try {
          const res = await fetch('/api/tools/videos/obsolete', {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'x-admin-ingest-key': adminKey,
            },
            body: JSON.stringify({ ids: lastResult.obsolete.map((item) => item.id) }),
          })
          const data = await res.json()
          if (!res.ok) {
            throw new Error(data?.error || res.statusText)
          }
          statusEl.textContent = `Deleted ${data?.deleted ?? 0} videos.`
          lastResult = null
          deleteBtn.disabled = true
          summaryEl.classList.add('hidden')
          listEl.innerHTML = ''
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Delete failed: ${message}`
        } finally {
          setBusy(false)
        }
      }

      scanBtn.addEventListener('click', () => {
        if (!busy) scanVideos()
      })

      deleteBtn.addEventListener('click', () => {
        if (!busy) deleteVideos()
      })
    </script>
  </body>
</html>
