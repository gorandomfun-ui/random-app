<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Erase Obsolete Videos</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 32px;
        background: #f6f6f6;
        color: #111;
      }
      h1 {
        margin-bottom: 8px;
        font-size: 28px;
      }
      p.description {
        max-width: 720px;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }
      .scan-options {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 18px;
        padding: 12px;
        margin-bottom: 14px;
        border: 1px solid #ececec;
        border-radius: 10px;
        background: #fafafa;
      }
      label.input {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
      }
      label.input input {
        width: 80px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      label.input select {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button.primary {
        background: #1f7aec;
        color: #fff;
      }
      button.danger {
        background: #e04646;
        color: #fff;
      }
      button.ghost {
        background: #fff;
        color: #333;
        border: 1px solid #d4d4d4;
      }
      button.ghost:not(:disabled):hover {
        background: #f5f5f5;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        font-size: 14px;
        margin-bottom: 12px;
        min-height: 20px;
      }
      .progress {
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: #e8e8e8;
        margin-bottom: 14px;
      }
      .progress.hidden {
        display: none;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: #1f7aec;
        transition: width 0.2s ease;
      }
      .summary {
        background: #fafafa;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid #ececec;
      }
      .summary strong {
        font-size: 15px;
      }
      .summary-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-top: 12px;
        padding-left: 0;
        list-style: none;
        font-size: 14px;
      }
      .summary-list.muted {
        color: #5f646c;
      }
      #list {
        max-height: 55vh;
        overflow-y: auto;
        padding-right: 4px;
      }
      .list-section {
        margin-bottom: 24px;
      }
      .list-section:last-child {
        margin-bottom: 0;
      }
      .list-section h2 {
        font-size: 18px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .list-section.rate-limited h2 {
        color: #7b4c0d;
      }
      .list-section.ambiguous h2 {
        color: #344054;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        font-size: 12px;
        border-radius: 999px;
        background: #e6ecf4;
        color: #2d3a4b;
      }
      .list-section.rate-limited .badge {
        background: #f7e5c7;
        color: #7b4c0d;
      }
      .list-section.ambiguous .badge {
        background: #e8e4f4;
        color: #403261;
      }
      .note {
        font-size: 13px;
        color: #5a5f66;
        margin-bottom: 12px;
      }
      .list-section .video-list {
        display: grid;
        gap: 10px;
      }
      details.video-item {
        background: #fff;
        border-radius: 10px;
        border: 1px solid #e3e3e3;
        padding: 12px 14px;
      }
      details.video-item summary {
        cursor: pointer;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      details.video-item summary span.meta {
        display: inline-flex;
        gap: 12px;
        font-size: 13px;
        font-weight: 500;
        color: #5a5a5a;
      }
      details.video-item .body {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.45;
      }
      details.video-item a {
        color: #1f7aec;
        word-break: break-all;
      }
      .hidden {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1215;
          color: #f1f1f1;
        }
        .card {
          background: #171a1f;
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
        label.input input {
          background: #0f1215;
          color: #f1f1f1;
          border-color: #2a2d33;
        }
        label.input select,
        .scan-options {
          background: #15181d;
          color: #f1f1f1;
          border-color: #2a2d33;
        }
        button.ghost {
          background: #15181d;
          color: #f1f1f1;
          border-color: #2a2d33;
        }
        button.ghost:not(:disabled):hover {
          background: #1e2229;
        }
        .summary {
          background: #161a1f;
          border-color: #22272f;
        }
        .progress {
          background: #252a33;
        }
        .summary-list.muted {
          color: #9da3af;
        }
        .list-section.rate-limited h2 {
          color: #f3c37a;
        }
        .list-section.ambiguous h2 {
          color: #bcb0ff;
        }
        .badge {
          background: #2a3140;
          color: #c5ccda;
        }
        .list-section.rate-limited .badge {
          background: #3a2a15;
          color: #f3c37a;
        }
        .list-section.ambiguous .badge {
          background: #322c4d;
          color: #cabfff;
        }
        .note {
          color: #adb3c0;
        }
        details.video-item {
          background: #161a1f;
          border-color: #232831;
        }
        details.video-item summary span.meta {
          color: #b7bcc5;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Erase Obsolete Videos</h1>
      <p class="description">
        Scan all videos, safely resume after a network interruption, then delete only confirmed unavailable videos.
      </p>

      <div class="controls">
        <button id="scanBtn" class="primary" type="button">Scan all videos</button>
        <button id="deleteBtn" class="danger" type="button" disabled>Delete confirmed obsolete</button>
      </div>
      <p class="note">Progress is saved after every batch. Temporary network and provider errors are never deleted.</p>

      <div id="status" class="status"></div>
      <div id="deleteStatus" class="status"></div>
      <div id="progress" class="progress hidden"><div id="progressBar" class="progress-bar"></div></div>
      <div id="summary" class="summary hidden"></div>
      <div id="list"></div>
    </main>

    <script type="module">
      const statusEl = document.getElementById('status')
      const deleteStatusEl = document.getElementById('deleteStatus')
      const summaryEl = document.getElementById('summary')
      const listEl = document.getElementById('list')
      const scanBtn = document.getElementById('scanBtn')
      const stopBtn = document.getElementById('stopBtn')
      const deleteBtn = document.getElementById('deleteBtn')
      const deleteRateLimitedBtn = document.getElementById('deleteRateLimitedBtn')
      const batchLimitEl = document.getElementById('batchLimit')
      const scanConcurrencyEl = document.getElementById('scanConcurrency')
      const timeoutMsEl = document.getElementById('timeoutMs')
      const providerFilterEl = document.getElementById('providerFilter')
      const forceScanEl = document.getElementById('forceScan')
      const progressEl = document.getElementById('progress')
      const progressBarEl = document.getElementById('progressBar')

      let adminKey = ''
      let scanning = false
      let deleting = false
      let lastResult = null
      let scanController = null
      let stopRequested = false
      const MAX_REVIEW_ITEMS = 300
      const SCAN_STALE_HOURS = 24 * 7

      function setAdminKey(value) {
        adminKey = String(value || '').trim()
        document.body.dataset.key = adminKey
        if (adminKey) {
          localStorage.setItem('local-ingest-key', adminKey)
        } else {
          localStorage.removeItem('local-ingest-key')
        }
        return adminKey
      }

      function getAdminKey(promptIfMissing = true) {
        if (adminKey) return adminKey
        const storedKey = localStorage.getItem('local-ingest-key') || ''
        if (storedKey) return setAdminKey(storedKey)
        if (!promptIfMissing) return ''
        return setAdminKey(window.prompt('Admin ingest key', '') || '')
      }

      async function adminFetch(url, options = {}) {
        const firstHeaders = new Headers(options.headers || {})
        firstHeaders.set('x-admin-ingest-key', getAdminKey(true))
        let response = await fetch(url, { ...options, headers: firstHeaders })
        if (response.status !== 401 && response.status !== 403) return response

        setAdminKey('')
        statusEl.textContent = 'Clé admin locale refusée. Ancienne clé effacée.'
        const nextKey = getAdminKey(true)
        if (!nextKey) return response

        const retryHeaders = new Headers(options.headers || {})
        retryHeaders.set('x-admin-ingest-key', nextKey)
        response = await fetch(url, { ...options, headers: retryHeaders })
        return response
      }

      getAdminKey(true)

      function normalizeCounts(rawCounts) {
        const counts = rawCounts && typeof rawCounts === 'object' ? rawCounts : {}
        const obsolete = counts.obsolete && typeof counts.obsolete === 'object' ? counts.obsolete : {}
        const rateLimited = counts.rateLimited && typeof counts.rateLimited === 'object' ? counts.rateLimited : {}
        const ambiguous = counts.ambiguous && typeof counts.ambiguous === 'object' ? counts.ambiguous : {}
        return {
          total:
            typeof counts.total === 'number'
              ? counts.total
              : typeof obsolete.total === 'number'
                ? obsolete.total
                : 0,
          providers:
            counts.providers && typeof counts.providers === 'object'
              ? counts.providers
              : obsolete.providers && typeof obsolete.providers === 'object'
                ? obsolete.providers
                : {},
          obsolete: {
            total:
              typeof obsolete.total === 'number'
                ? obsolete.total
                : typeof counts.total === 'number'
                  ? counts.total
                  : 0,
            providers:
              obsolete.providers && typeof obsolete.providers === 'object'
                ? obsolete.providers
                : counts.providers && typeof counts.providers === 'object'
                  ? counts.providers
                  : {},
          },
          rateLimited: {
            total: typeof rateLimited.total === 'number' ? rateLimited.total : 0,
            providers:
              rateLimited.providers && typeof rateLimited.providers === 'object'
                ? rateLimited.providers
                : {},
          },
          ambiguous: {
            total: typeof ambiguous.total === 'number' ? ambiguous.total : 0,
            providers:
              ambiguous.providers && typeof ambiguous.providers === 'object'
                ? ambiguous.providers
                : {},
          },
        }
      }

      function emptyCounts() {
        return {
          total: 0,
          providers: {},
          obsolete: { total: 0, providers: {} },
          rateLimited: { total: 0, providers: {} },
          ambiguous: { total: 0, providers: {} },
        }
      }

      function mergeProviderCounts(target, source) {
        Object.entries(source || {}).forEach(([name, value]) => {
          target[name] = (target[name] || 0) + (Number(value) || 0)
        })
      }

      function mergeCounts(target, rawSource) {
        const source = normalizeCounts(rawSource)
        target.total += source.total
        target.obsolete.total += source.obsolete.total
        target.rateLimited.total += source.rateLimited.total
        target.ambiguous.total += source.ambiguous.total
        mergeProviderCounts(target.providers, source.providers)
        mergeProviderCounts(target.obsolete.providers, source.obsolete.providers)
        mergeProviderCounts(target.rateLimited.providers, source.rateLimited.providers)
        mergeProviderCounts(target.ambiguous.providers, source.ambiguous.providers)
      }

      function mergeBatchResult(target, batch) {
        target.checked += batch.checked || 0
        target.errors += batch.errors || 0
        target.durationMs += batch.durationMs || 0
        target.batches += 1
        target.done = Boolean(batch.done)
        target.nextCursor = batch.nextCursor || null
        target.obsolete.push(...(Array.isArray(batch.obsolete) ? batch.obsolete : []))
        pushLimited(target.rateLimited, batch.rateLimited)
        pushLimited(target.ambiguous, batch.ambiguous)
        mergeCounts(target.counts, batch.counts)
      }

      function pushLimited(target, source) {
        if (!Array.isArray(source) || target.length >= MAX_REVIEW_ITEMS) return
        const available = MAX_REVIEW_ITEMS - target.length
        target.push(...source.slice(0, available))
      }

      function updateActionButtons() {
        const obsoleteCount = lastResult?.counts?.obsolete?.total ?? lastResult?.obsolete?.length ?? 0
        const scanId = lastResult?.scanId || ''
        deleteBtn.disabled = deleting || !obsoleteCount || !scanId
        scanBtn.disabled = scanning || deleting
        if (deleteRateLimitedBtn) deleteRateLimitedBtn.disabled = true
      }

      function buildCompletionMessage(result) {
        if (!result) return ''
        const obsoleteCount = result.counts?.obsolete?.total ?? result.obsolete?.length ?? 0
        const rateLimitedCount = result.counts?.rateLimited?.total ?? result.rateLimited?.length ?? 0
        const ambiguousCount = result.counts?.ambiguous?.total ?? result.ambiguous?.length ?? 0
        const batches = result.batches || 0
        let message = result.stopped ? 'Stopped.' : 'Done.'
        if (batches) {
          message += ` ${batches} batch${batches > 1 ? 'es' : ''}, ${result.checked || 0} checked.`
        }
        message += obsoleteCount
          ? ` ${obsoleteCount} obsolete video${obsoleteCount > 1 ? 's' : ''} detected.`
          : ' No confirmed obsolete videos.'
        if (rateLimitedCount) {
          message += ` ${rateLimitedCount} item${rateLimitedCount > 1 ? 's' : ''} hit HTTP 429.`
        }
        if (ambiguousCount) {
          message += ` ${ambiguousCount} network issue${ambiguousCount > 1 ? 's' : ''} saved for manual review.`
        }
        if (result.expectedTotal && result.checked < result.expectedTotal) {
          message += ` ${Math.max(0, result.expectedTotal - result.checked)} left.`
        }
        return message
      }

      function getScanOptions() {
        const batchLimit = Math.max(100, Math.min(1000, Number(batchLimitEl?.value || 1000) || 1000))
        const concurrency = Math.max(1, Math.min(80, Number(scanConcurrencyEl?.value || 48) || 48))
        const timeoutMs = Math.max(1000, Math.min(10000, Number(timeoutMsEl?.value || 4000) || 4000))
        const provider = providerFilterEl?.value || 'all'
        const force = Boolean(forceScanEl?.checked)
        return { batchLimit, concurrency, timeoutMs, provider, force }
      }

      function buildScanParams(options, cursor = null) {
        const params = new URLSearchParams({
          mode: 'chunk',
          limit: String(options.batchLimit),
          concurrency: String(options.concurrency),
          timeoutMs: String(options.timeoutMs),
          staleHours: String(SCAN_STALE_HOURS),
          provider: options.provider,
        })
        if (options.force) params.set('force', '1')
        if (cursor) params.set('cursor', cursor)
        return params
      }

      async function fetchScanStats(options) {
        const params = new URLSearchParams({
          mode: 'stats',
          staleHours: String(SCAN_STALE_HOURS),
          provider: options.provider,
        })
        if (options.force) params.set('force', '1')
        const res = await adminFetch(`/api/tools/videos/obsolete?${params.toString()}`, { method: 'GET' })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) {
          throw new Error(data?.error || res.statusText)
        }
        return data
      }

      function formatDuration(ms) {
        if (!ms || ms < 1000) return '0s'
        const seconds = Math.floor(ms / 1000)
        const hours = Math.floor(seconds / 3600)
        const minutes = Math.floor((seconds % 3600) / 60)
        const rest = seconds % 60
        if (hours) return `${hours}h ${String(minutes).padStart(2, '0')}m`
        if (minutes) return `${minutes}m ${String(rest).padStart(2, '0')}s`
        return `${rest}s`
      }

      function updateProgress(result) {
        if (!progressEl || !progressBarEl) return
        const total = result?.expectedTotal || 0
        if (!total) {
          progressEl.classList.add('hidden')
          progressBarEl.style.width = '0%'
          return
        }
        progressEl.classList.remove('hidden')
        const pct = Math.max(0, Math.min(100, (result.checked / total) * 100))
        progressBarEl.style.width = `${pct.toFixed(1)}%`
      }

      function setBusy(state) {
        scanning = state
        scanBtn.disabled = state || deleting
        if (stopBtn) stopBtn.disabled = !state
        if (batchLimitEl) batchLimitEl.disabled = state
        if (scanConcurrencyEl) scanConcurrencyEl.disabled = state
        if (timeoutMsEl) timeoutMsEl.disabled = state
        if (providerFilterEl) providerFilterEl.disabled = state
        if (forceScanEl) forceScanEl.disabled = state
        updateActionButtons()
        if (state) {
          statusEl.textContent = 'Scanning…'
        } else {
          scanController = null
        }
      }

      function renderSummary(data) {
        if (!data) {
          summaryEl.classList.add('hidden')
          summaryEl.innerHTML = ''
          return
        }
        summaryEl.classList.remove('hidden')
        const counts = normalizeCounts(data.counts)
        const obsoleteTotal = counts.obsolete.total
        const obsoleteProviders = counts.obsolete.providers || {}
        const rateLimitedTotal = counts.rateLimited.total
        const rateLimitedProviders = counts.rateLimited.providers || {}
        const ambiguousTotal = counts.ambiguous.total
        const ambiguousProviders = counts.ambiguous.providers || {}
        const duration =
          typeof data.durationMs === 'number'
            ? (data.durationMs / 1000).toFixed(data.durationMs >= 10000 ? 0 : 1)
            : null
        const expectedTotal = Number(data.expectedTotal || 0)
        const catalogTotal = Number(data.catalogTotal || 0)
        const remaining = expectedTotal ? Math.max(0, expectedTotal - data.checked) : 0
        const stats = [
          `<strong>Checked:</strong> ${data.checked}${expectedTotal ? ` / ${expectedTotal}` : ''}`,
          remaining ? `<strong>Left:</strong> ${remaining}` : null,
          catalogTotal ? `<strong>Catalog:</strong> ${catalogTotal}` : null,
          data.batches ? `<strong>Batches:</strong> ${data.batches}` : null,
          data.errors ? `<strong>Errors:</strong> ${data.errors}` : null,
          `<strong>Obsolete:</strong> ${obsoleteTotal}`,
          rateLimitedTotal ? `<strong>429:</strong> ${rateLimitedTotal}` : null,
          ambiguousTotal ? `<strong>Ambiguous:</strong> ${ambiguousTotal}` : null,
        ]
          .filter(Boolean)
          .join(' • ')
        const obsoleteList = obsoleteTotal
          ? `<ul class="summary-list">${Object.entries(obsoleteProviders)
              .map(([name, value]) => `<li><strong>${name}</strong>: ${value}</li>`)
              .join('')}</ul>`
          : '<p>No confirmed obsolete videos.</p>'
        const rateLimitedList = rateLimitedTotal
          ? `<div class="summary-rate-limited">
              <div class="note">HTTP 429 items were held back from deletion. Retry once the rate limit cools down.</div>
              ${
                Object.entries(rateLimitedProviders).length
                  ? `<ul class="summary-list muted">${Object.entries(rateLimitedProviders)
                      .map(([name, value]) => `<li><strong>${name}</strong>: ${value}</li>`)
                      .join('')}</ul>`
                  : ''
              }
            </div>`
          : ''
        const ambiguousList = ambiguousTotal
          ? `<div class="summary-ambiguous">
              <div class="note">Network / ambiguous items were kept aside for another pass.</div>
              ${
                Object.entries(ambiguousProviders).length
                  ? `<ul class="summary-list muted">${Object.entries(ambiguousProviders)
                      .map(([name, value]) => `<li><strong>${name}</strong>: ${value}</li>`)
                      .join('')}</ul>`
                  : ''
              }
            </div>`
          : ''
        summaryEl.innerHTML = `
          <div>${stats}</div>
          ${duration ? `<div><strong>Duration:</strong> ${duration}s</div>` : ''}
          ${obsoleteList}
          ${ambiguousTotal > data.ambiguous.length ? `<p class="note">Showing ${data.ambiguous.length} ambiguous examples out of ${ambiguousTotal}.</p>` : ''}
          ${rateLimitedTotal > data.rateLimited.length ? `<p class="note">Showing ${data.rateLimited.length} rate-limited examples out of ${rateLimitedTotal}.</p>` : ''}
          ${ambiguousList}
          ${rateLimitedList}
        `
      }

      function renderList(data) {
        const obsoleteItems = Array.isArray(data?.obsolete) ? data.obsolete : []
        const rateLimitedItems = Array.isArray(data?.rateLimited) ? data.rateLimited : []
        const ambiguousItems = Array.isArray(data?.ambiguous) ? data.ambiguous : []
        const counts = normalizeCounts(data?.counts)
        const rateLimitedTotal = counts.rateLimited.total || rateLimitedItems.length
        const ambiguousTotal = counts.ambiguous.total || ambiguousItems.length
        const renderItems = (items) =>
          items
            .map((item) => {
              const safeReason = item.reason ? item.reason.replace(/</g, '&lt;') : 'unknown'
              const safeTitle = item.title ? item.title.replace(/</g, '&lt;') : ''
              const urlLink = item.url
                ? `<a href="${item.url}" target="_blank" rel="noreferrer">${item.url}</a>`
                : '<em>No URL</em>'
              const videoId = item.videoId ? `<div>videoId: <code>${item.videoId}</code></div>` : ''
              const status = item.status != null ? `<div>Status: ${item.status}</div>` : ''
              const titleLine = safeTitle ? `<div>Title: ${safeTitle}</div>` : ''
              return `
                <details class="video-item">
                  <summary>
                    <span>${item.provider}</span>
                    <span class="meta">
                      <span>${safeReason}</span>
                      ${item.status != null ? `<span>${item.status}</span>` : ''}
                    </span>
                  </summary>
                  <div class="body">
                    <div>ID: <code>${item.id}</code></div>
                    ${titleLine}
                    ${videoId}
                    ${status}
                    <div style="margin-top:6px;">${urlLink}</div>
                  </div>
                </details>
              `
            })
            .join('')

        const obsoleteSection = `
          <section class="list-section">
            <h2>Confirmed obsolete <span class="badge">${obsoleteItems.length}</span></h2>
            ${
              obsoleteItems.length
                ? `<div class="video-list">${renderItems(obsoleteItems)}</div>`
                : '<p class="note">No confirmed obsolete videos.</p>'
            }
          </section>
        `

        const rateLimitedSection = `
          <section class="list-section rate-limited">
            <h2>HTTP 429 (rate limited) <span class="badge">${rateLimitedTotal}</span></h2>
            <p class="note">These URLs returned HTTP 429 (Too Many Requests). They are kept aside and are not deleted by this tool.</p>
            ${
              rateLimitedItems.length
                ? `<div class="video-list">${renderItems(rateLimitedItems)}</div>`
                : ''
            }
          </section>
        `

        const ambiguousSection = `
          <section class="list-section ambiguous">
            <h2>Ambiguous / network errors <span class="badge">${ambiguousTotal}</span></h2>
            <p class="note">These failed because of network/API errors. Keep them for a later scan or manual review.</p>
            ${
              ambiguousItems.length
                ? `<div class="video-list">${renderItems(ambiguousItems)}</div>`
                : ''
            }
          </section>
        `

        if (!obsoleteItems.length && !rateLimitedItems.length && !ambiguousItems.length) {
          listEl.innerHTML = ''
          return
        }
        listEl.innerHTML = `${obsoleteSection}${ambiguousSection}${rateLimitedSection}`
      }

      async function scanVideosLegacy() {
        if (!getAdminKey(true)) {
          alert('Missing admin ingest key.')
          return false
        }
        setBusy(true)
        stopRequested = false
        scanController = new AbortController()
        lastResult = null
        summaryEl.classList.add('hidden')
        updateProgress(null)
        listEl.innerHTML = ''
        const options = getScanOptions()
        const aggregate = {
          checked: 0,
          errors: 0,
          durationMs: 0,
          batches: 0,
          done: false,
          stopped: false,
          nextCursor: null,
          expectedTotal: 0,
          catalogTotal: 0,
          obsolete: [],
          rateLimited: [],
          ambiguous: [],
          counts: emptyCounts(),
        }
        try {
          const stats = await fetchScanStats(options)
          aggregate.expectedTotal = Number(stats.candidates || 0)
          aggregate.catalogTotal = Number(stats.total || 0)
          lastResult = aggregate
          renderSummary(aggregate)
          updateProgress(aggregate)

          if (!aggregate.expectedTotal) {
            aggregate.done = true
            statusEl.textContent = options.force
              ? 'No videos found for this provider.'
              : 'No videos need checking right now. Enable force recheck for a full audit.'
            return true
          }

          let cursor = null
          const startedAt = Date.now()

          while (!stopRequested) {
            const params = buildScanParams(options, cursor)
            const percent = aggregate.expectedTotal
              ? Math.min(100, (aggregate.checked / aggregate.expectedTotal) * 100).toFixed(1)
              : '0.0'
            statusEl.textContent = `Scanning batch ${aggregate.batches + 1}… ${aggregate.checked}/${aggregate.expectedTotal} checked (${percent}%). Elapsed ${formatDuration(Date.now() - startedAt)}.`

            const res = await adminFetch(`/api/tools/videos/obsolete?${params.toString()}`, {
              method: 'GET',
              signal: scanController.signal,
            })
            const batch = await res.json().catch(() => ({}))
            if (!res.ok) {
              throw new Error(batch?.error || res.statusText)
            }

            mergeBatchResult(aggregate, batch)
            cursor = batch.nextCursor || null
            lastResult = aggregate
            renderSummary(aggregate)
            renderList(aggregate)
            updateActionButtons()
            updateProgress(aggregate)

            const errorsLabel = aggregate.errors ? ` (${aggregate.errors} errors)` : ''
            const left = aggregate.expectedTotal ? Math.max(0, aggregate.expectedTotal - aggregate.checked) : 0
            const progressPercent = aggregate.expectedTotal
              ? Math.min(100, (aggregate.checked / aggregate.expectedTotal) * 100).toFixed(1)
              : '0.0'
            statusEl.textContent = `Scanning… ${aggregate.checked}/${aggregate.expectedTotal} checked (${progressPercent}%), ${left} left, ${aggregate.batches} batch${aggregate.batches > 1 ? 'es' : ''}${errorsLabel}.`

            if (batch.done || !cursor || !batch.checked) {
              aggregate.done = true
              break
            }

            await new Promise((resolve) => setTimeout(resolve, 120))
          }

          if (stopRequested) {
            aggregate.stopped = true
          }
          aggregate.durationMs = Date.now() - startedAt
          lastResult = aggregate
          statusEl.textContent = buildCompletionMessage(aggregate)
          return true
        } catch (error) {
          if (stopRequested || error?.name === 'AbortError') {
            aggregate.stopped = true
            lastResult = aggregate
            renderSummary(aggregate)
            renderList(aggregate)
            updateProgress(aggregate)
            statusEl.textContent = buildCompletionMessage(aggregate)
            return false
          }
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Error: ${message}`
          lastResult = null
          summaryEl.classList.add('hidden')
          updateProgress(null)
          listEl.innerHTML = ''
          return false
        } finally {
          setBusy(false)
        }
      }

      async function requestJobAction(action) {
        const res = await adminFetch('/api/tools/videos/obsolete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action }),
        })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data?.error || res.statusText)
        return data
      }

      function renderPersistedJob(data) {
        if (!data?.exists) return
        lastResult = data
        renderSummary(data)
        renderList(data)
        updateProgress(data)
        updateActionButtons()
        if (!scanning) {
          scanBtn.textContent = data.status === 'running' ? 'Resume scan' : 'Scan all videos'
        }
      }

      async function loadPersistedJob(updateStatus = true) {
        if (!getAdminKey(false)) return
        try {
          const res = await adminFetch('/api/tools/videos/obsolete?mode=job', { method: 'GET' })
          const data = await res.json().catch(() => ({}))
          if (!res.ok) throw new Error(data?.error || res.statusText)
          if (!data?.exists) return
          renderPersistedJob(data)
          if (updateStatus) {
            if (data.status === 'running') {
              statusEl.textContent = `Scan paused safely at ${data.checked}/${data.expectedTotal}. Click Resume scan.`
            } else {
              statusEl.textContent = buildCompletionMessage(data)
            }
          }
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Unable to restore scan status: ${message}`
        }
      }

      async function scanVideos() {
        if (!getAdminKey(true)) {
          alert('Missing admin ingest key.')
          return
        }
        setBusy(true)
        scanBtn.textContent = 'Scanning…'
        try {
          let data = await requestJobAction('start')
          renderPersistedJob(data)
          while (data.status === 'running') {
            const percent = data.expectedTotal
              ? Math.min(100, (data.checked / data.expectedTotal) * 100).toFixed(1)
              : '0.0'
            statusEl.textContent = `Scanning… ${data.checked}/${data.expectedTotal} checked (${percent}%). Progress is saved.`
            if (deleting) {
              await new Promise((resolve) => setTimeout(resolve, 300))
              continue
            }
            if (data.busy) {
              await new Promise((resolve) => setTimeout(resolve, 1000))
            }
            data = await requestJobAction('step')
            renderPersistedJob(data)
            await new Promise((resolve) => setTimeout(resolve, 300))
          }
          statusEl.textContent = buildCompletionMessage(data)
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Connection interrupted. Progress is saved. Click Resume scan. (${message})`
        } finally {
          setBusy(false)
          scanBtn.textContent = lastResult?.status === 'running' ? 'Resume scan' : 'Scan all videos'
          updateActionButtons()
        }
      }

      async function deleteVideos() {
        const count = lastResult?.counts?.obsolete?.total ?? 0
        const scanId = lastResult?.scanId || ''
        if (!count || !scanId) return
        if (!window.confirm(`Delete ${count} confirmed obsolete video${count > 1 ? 's' : ''}? This cannot be undone.`)) return

        deleting = true
        const confirmedBefore = new Date().toISOString()
        deleteStatusEl.textContent = 'Preparing deletion of the items already confirmed…'
        updateActionButtons()
        let totalDeleted = 0
        let previousRemaining = count
        try {
          let done = false
          while (!done) {
            const res = await adminFetch('/api/tools/videos/obsolete', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ scanId, confirmedBefore }),
            })
            const data = await res.json().catch(() => ({}))
            if (res.status === 409 && data?.busy) {
              deleteStatusEl.textContent = 'Waiting for the current scan batch to finish safely…'
              await new Promise((resolve) => setTimeout(resolve, 500))
              continue
            }
            if (!res.ok) throw new Error(data?.error || res.statusText)
            totalDeleted += Number(data.deleted || 0)
            done = Boolean(data.done)
            if (!done && Number(data.remaining) >= previousRemaining && !Number(data.deleted || 0)) {
              throw new Error('No deletion progress; remaining candidates were kept safely.')
            }
            previousRemaining = Number(data.remaining || 0)
            deleteStatusEl.textContent = `Deleting items confirmed before this click… ${totalDeleted} deleted, ${data.remaining || 0} left.`
          }
          await loadPersistedJob(false)
          deleteStatusEl.textContent = `Deleted ${totalDeleted} confirmed obsolete video${totalDeleted === 1 ? '' : 's'}. The scan ${scanning ? 'continues' : 'is unchanged'}; ambiguous items were kept.`
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          deleteStatusEl.textContent = `Deletion interrupted. Completed deletions are saved; click Delete again to resume. (${message})`
        } finally {
          deleting = false
          updateActionButtons()
        }
      }

      scanBtn.addEventListener('click', () => {
        if (!scanning && !deleting) scanVideos()
      })

      stopBtn?.addEventListener('click', () => {
        if (!scanning) return
        stopRequested = true
        statusEl.textContent = 'Stopping after current request…'
        try {
          scanController?.abort()
        } catch {
          /* ignore */
        }
      })

      deleteBtn.addEventListener('click', () => {
        if (!deleting) deleteVideos()
      })

      window.addEventListener('online', loadPersistedJob)
      loadPersistedJob()
    </script>
  </body>
</html>
