<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Erase Obsolete Videos</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 32px;
        background: #f6f6f6;
        color: #111;
      }
      h1 {
        margin-bottom: 8px;
        font-size: 28px;
      }
      p.description {
        max-width: 720px;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
      }
      label.input {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
      }
      label.input input {
        width: 80px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button.primary {
        background: #1f7aec;
        color: #fff;
      }
      button.danger {
        background: #e04646;
        color: #fff;
      }
      button.ghost {
        background: #fff;
        color: #333;
        border: 1px solid #d4d4d4;
      }
      button.ghost:not(:disabled):hover {
        background: #f5f5f5;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        font-size: 14px;
        margin-bottom: 12px;
        min-height: 20px;
      }
      .summary {
        background: #fafafa;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid #ececec;
      }
      .summary strong {
        font-size: 15px;
      }
      .summary-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-top: 12px;
        padding-left: 0;
        list-style: none;
        font-size: 14px;
      }
      .summary-list.muted {
        color: #5f646c;
      }
      #list {
        max-height: 55vh;
        overflow-y: auto;
        padding-right: 4px;
      }
      .list-section {
        margin-bottom: 24px;
      }
      .list-section:last-child {
        margin-bottom: 0;
      }
      .list-section h2 {
        font-size: 18px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .list-section.rate-limited h2 {
        color: #7b4c0d;
      }
      .list-section.ambiguous h2 {
        color: #344054;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        font-size: 12px;
        border-radius: 999px;
        background: #e6ecf4;
        color: #2d3a4b;
      }
      .list-section.rate-limited .badge {
        background: #f7e5c7;
        color: #7b4c0d;
      }
      .list-section.ambiguous .badge {
        background: #e8e4f4;
        color: #403261;
      }
      .note {
        font-size: 13px;
        color: #5a5f66;
        margin-bottom: 12px;
      }
      .list-section .video-list {
        display: grid;
        gap: 10px;
      }
      details.video-item {
        background: #fff;
        border-radius: 10px;
        border: 1px solid #e3e3e3;
        padding: 12px 14px;
      }
      details.video-item summary {
        cursor: pointer;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      details.video-item summary span.meta {
        display: inline-flex;
        gap: 12px;
        font-size: 13px;
        font-weight: 500;
        color: #5a5a5a;
      }
      details.video-item .body {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.45;
      }
      details.video-item a {
        color: #1f7aec;
        word-break: break-all;
      }
      .hidden {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1215;
          color: #f1f1f1;
        }
        .card {
          background: #171a1f;
          box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
        label.input input {
          background: #0f1215;
          color: #f1f1f1;
          border-color: #2a2d33;
        }
        button.ghost {
          background: #15181d;
          color: #f1f1f1;
          border-color: #2a2d33;
        }
        button.ghost:not(:disabled):hover {
          background: #1e2229;
        }
        .summary {
          background: #161a1f;
          border-color: #22272f;
        }
        .summary-list.muted {
          color: #9da3af;
        }
        .list-section.rate-limited h2 {
          color: #f3c37a;
        }
        .list-section.ambiguous h2 {
          color: #bcb0ff;
        }
        .badge {
          background: #2a3140;
          color: #c5ccda;
        }
        .list-section.rate-limited .badge {
          background: #3a2a15;
          color: #f3c37a;
        }
        .list-section.ambiguous .badge {
          background: #322c4d;
          color: #cabfff;
        }
        .note {
          color: #adb3c0;
        }
        details.video-item {
          background: #161a1f;
          border-color: #232831;
        }
        details.video-item summary span.meta {
          color: #b7bcc5;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Erase Obsolete Videos</h1>
      <p class="description">
        Scan the <code>items</code> collection for videos that look unavailable (404, removed, dead links).
        The tool now sweeps the full catalog in one go so you always get an up-to-date obsolete list.
      </p>

      <div class="controls">
        <button id="scanBtn" class="primary" type="button">Scan all videos</button>
        <button id="deleteBtn" class="danger" type="button" disabled>Delete confirmed obsolete</button>
        <button id="deleteRateLimitedBtn" class="ghost" type="button" disabled>Delete 429 items (use sparingly)</button>
      </div>

      <label style="display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:8px;">
        <input id="autoScanToggle" type="checkbox" />
        Auto-scan quotidien (19h)
      </label>
      <p id="autoScanStatus" class="note"></p>

      <div id="status" class="status"></div>
      <div id="summary" class="summary hidden"></div>
      <div id="list"></div>
    </main>

    <script type="module">
      const statusEl = document.getElementById('status')
      const summaryEl = document.getElementById('summary')
      const listEl = document.getElementById('list')
      const scanBtn = document.getElementById('scanBtn')
      const deleteBtn = document.getElementById('deleteBtn')
      const deleteRateLimitedBtn = document.getElementById('deleteRateLimitedBtn')
      const autoScanToggle = document.getElementById('autoScanToggle')
      const autoScanStatus = document.getElementById('autoScanStatus')

      let adminKey = ''
      let busy = false
      let lastResult = null
      const AUTO_SCAN_WINDOWS = [
        { hour: 9, minute: 30 },
        { hour: 19, minute: 0 },
      ]
      const AUTO_SCAN_KEY = 'erase-obsolete:last-auto-scan'
      const AUTO_SCAN_PREF_KEY = 'erase-obsolete:auto-enabled'
      const AUTO_SCAN_WINDOW_KEY = 'erase-obsolete:last-window'

      const storedKey = localStorage.getItem('local-ingest-key') || ''
      adminKey = storedKey || window.prompt('Admin ingest key', '') || ''
      if (adminKey) {
        localStorage.setItem('local-ingest-key', adminKey)
      }
      document.body.dataset.key = adminKey

      if (autoScanToggle) {
        const stored = localStorage.getItem(AUTO_SCAN_PREF_KEY)
        autoScanToggle.checked = stored === null ? true : stored === '1'
        autoScanToggle.addEventListener('change', () => {
          localStorage.setItem(AUTO_SCAN_PREF_KEY, autoScanToggle.checked ? '1' : '0')
          updateAutoStatus()
        })
      }

      function normalizeCounts(rawCounts) {
        const counts = rawCounts && typeof rawCounts === 'object' ? rawCounts : {}
        const obsolete = counts.obsolete && typeof counts.obsolete === 'object' ? counts.obsolete : {}
        const rateLimited = counts.rateLimited && typeof counts.rateLimited === 'object' ? counts.rateLimited : {}
        const ambiguous = counts.ambiguous && typeof counts.ambiguous === 'object' ? counts.ambiguous : {}
        return {
          total:
            typeof counts.total === 'number'
              ? counts.total
              : typeof obsolete.total === 'number'
                ? obsolete.total
                : 0,
          providers:
            counts.providers && typeof counts.providers === 'object'
              ? counts.providers
              : obsolete.providers && typeof obsolete.providers === 'object'
                ? obsolete.providers
                : {},
          obsolete: {
            total:
              typeof obsolete.total === 'number'
                ? obsolete.total
                : typeof counts.total === 'number'
                  ? counts.total
                  : 0,
            providers:
              obsolete.providers && typeof obsolete.providers === 'object'
                ? obsolete.providers
                : counts.providers && typeof counts.providers === 'object'
                  ? counts.providers
                  : {},
          },
          rateLimited: {
            total: typeof rateLimited.total === 'number' ? rateLimited.total : 0,
            providers:
              rateLimited.providers && typeof rateLimited.providers === 'object'
                ? rateLimited.providers
                : {},
          },
          ambiguous: {
            total: typeof ambiguous.total === 'number' ? ambiguous.total : 0,
            providers:
              ambiguous.providers && typeof ambiguous.providers === 'object'
                ? ambiguous.providers
                : {},
          },
        }
      }

      function updateActionButtons(forceDisable = false) {
        const disable = forceDisable || busy
        const obsoleteCount = lastResult?.obsolete?.length ?? 0
        const rateLimitedCount = lastResult?.rateLimited?.length ?? 0
        deleteBtn.disabled = disable || !obsoleteCount
        deleteRateLimitedBtn.disabled = disable || !rateLimitedCount
      }

      function getTodayKey(date = new Date()) {
        return date.toISOString().slice(0, 10)
      }

      function getAutoWindowTime(window, reference = new Date()) {
        const d = new Date(reference)
        d.setHours(window.hour, window.minute, 0, 0)
        return d
      }

      function getAutoWindowIndex(now = new Date()) {
        let index = -1
        AUTO_SCAN_WINDOWS.forEach((window, idx) => {
          if (now >= getAutoWindowTime(window, now)) index = idx
        })
        return index >= 0 ? index : null
      }

      function hasAutoScanToday() {
        const lastRun = localStorage.getItem(AUTO_SCAN_KEY)
        if (!lastRun) return false
        return new Date(lastRun).toDateString() === new Date().toDateString()
      }

      function getLastAutoScanWindow() {
        const raw = localStorage.getItem(AUTO_SCAN_WINDOW_KEY)
        if (!raw) return null
        const [date, index] = raw.split(':')
        if (date !== getTodayKey()) return null
        if (index === 'manual') return AUTO_SCAN_WINDOWS.length
        const parsed = Number(index)
        return Number.isFinite(parsed) ? parsed : null
      }

      function markAutoScan(windowIndex = null) {
        localStorage.setItem(AUTO_SCAN_KEY, new Date().toISOString())
        const value = typeof windowIndex === 'number' ? String(windowIndex) : 'manual'
        localStorage.setItem(AUTO_SCAN_WINDOW_KEY, `${getTodayKey()}:${value}`)
        updateAutoStatus()
      }

      function updateAutoStatus() {
        if (!autoScanStatus) return
        const lastRun = localStorage.getItem(AUTO_SCAN_KEY)
        const enabled = autoScanToggle ? autoScanToggle.checked : true
        const windowsLabel = AUTO_SCAN_WINDOWS.map((window) => `${String(window.hour).padStart(2, '0')}:${String(window.minute).padStart(2, '0')}`).join(' / ')
        let message = lastRun ? `Dernier scan auto: ${new Date(lastRun).toLocaleString()}` : 'Aucun scan auto effectué.'
        if (enabled) {
          if (hasAutoScanToday()) {
            message += ' • Scan du jour effectué.'
          } else {
            const lastWindow = getLastAutoScanWindow()
            const nextWindow = AUTO_SCAN_WINDOWS.find((_, idx) => (lastWindow ?? -1) < idx)
            if (nextWindow) {
              message += ` • Prochain auto-scan vers ${String(nextWindow.hour).padStart(2, '0')}:${String(nextWindow.minute).padStart(2, '0')}.`
            }
          }
          message += ` • Fenêtres: ${windowsLabel}.`
        } else {
          message += ' • Auto-scan désactivé.'
        }
        autoScanStatus.textContent = message
      }

      function buildCompletionMessage(result) {
        if (!result) return ''
        const obsoleteCount = result.obsolete?.length ?? 0
        const rateLimitedCount = result.rateLimited?.length ?? 0
        const ambiguousCount = result.ambiguous?.length ?? 0
        let message = 'Done.'
        message += obsoleteCount
          ? ` ${obsoleteCount} obsolete video${obsoleteCount > 1 ? 's' : ''} detected.`
          : ' No confirmed obsolete videos.'
        if (rateLimitedCount) {
          message += ` ${rateLimitedCount} item${rateLimitedCount > 1 ? 's' : ''} hit HTTP 429.`
        }
        if (ambiguousCount) {
          message += ` ${ambiguousCount} network issue${ambiguousCount > 1 ? 's' : ''} saved for manual review.`
        }
        return message
      }

      function setBusy(state) {
        busy = state
        scanBtn.disabled = state
        updateActionButtons(state)
        if (state) {
          statusEl.textContent = 'Scanning…'
        }
      }

      function renderSummary(data) {
        if (!data) {
          summaryEl.classList.add('hidden')
          summaryEl.innerHTML = ''
          return
        }
        summaryEl.classList.remove('hidden')
        const counts = normalizeCounts(data.counts)
        const obsoleteTotal = counts.obsolete.total
        const obsoleteProviders = counts.obsolete.providers || {}
        const rateLimitedTotal = counts.rateLimited.total
        const rateLimitedProviders = counts.rateLimited.providers || {}
        const ambiguousTotal = counts.ambiguous.total
        const ambiguousProviders = counts.ambiguous.providers || {}
        const duration =
          typeof data.durationMs === 'number'
            ? (data.durationMs / 1000).toFixed(data.durationMs >= 10000 ? 0 : 1)
            : null
        const stats = [
          `<strong>Checked:</strong> ${data.checked}`,
          data.errors ? `<strong>Errors:</strong> ${data.errors}` : null,
          `<strong>Obsolete:</strong> ${obsoleteTotal}`,
          rateLimitedTotal ? `<strong>429:</strong> ${rateLimitedTotal}` : null,
          ambiguousTotal ? `<strong>Ambiguous:</strong> ${ambiguousTotal}` : null,
        ]
          .filter(Boolean)
          .join(' • ')
        const obsoleteList = obsoleteTotal
          ? `<ul class="summary-list">${Object.entries(obsoleteProviders)
              .map(([name, value]) => `<li><strong>${name}</strong>: ${value}</li>`)
              .join('')}</ul>`
          : '<p>No confirmed obsolete videos.</p>'
        const rateLimitedList = rateLimitedTotal
          ? `<div class="summary-rate-limited">
              <div class="note">HTTP 429 items were held back from deletion. Retry once the rate limit cools down.</div>
              ${
                Object.entries(rateLimitedProviders).length
                  ? `<ul class="summary-list muted">${Object.entries(rateLimitedProviders)
                      .map(([name, value]) => `<li><strong>${name}</strong>: ${value}</li>`)
                      .join('')}</ul>`
                  : ''
              }
            </div>`
          : ''
        const ambiguousList = ambiguousTotal
          ? `<div class="summary-ambiguous">
              <div class="note">Network / ambiguous items were kept aside for another pass.</div>
              ${
                Object.entries(ambiguousProviders).length
                  ? `<ul class="summary-list muted">${Object.entries(ambiguousProviders)
                      .map(([name, value]) => `<li><strong>${name}</strong>: ${value}</li>`)
                      .join('')}</ul>`
                  : ''
              }
            </div>`
          : ''
        summaryEl.innerHTML = `
          <div>${stats}</div>
          ${duration ? `<div><strong>Duration:</strong> ${duration}s</div>` : ''}
          ${obsoleteList}
          ${ambiguousList}
          ${rateLimitedList}
        `
      }

      function renderList(data) {
        const obsoleteItems = Array.isArray(data?.obsolete) ? data.obsolete : []
        const rateLimitedItems = Array.isArray(data?.rateLimited) ? data.rateLimited : []
        const ambiguousItems = Array.isArray(data?.ambiguous) ? data.ambiguous : []
        const renderItems = (items) =>
          items
            .map((item) => {
              const safeReason = item.reason ? item.reason.replace(/</g, '&lt;') : 'unknown'
              const safeTitle = item.title ? item.title.replace(/</g, '&lt;') : ''
              const urlLink = item.url
                ? `<a href="${item.url}" target="_blank" rel="noreferrer">${item.url}</a>`
                : '<em>No URL</em>'
              const videoId = item.videoId ? `<div>videoId: <code>${item.videoId}</code></div>` : ''
              const status = item.status != null ? `<div>Status: ${item.status}</div>` : ''
              const titleLine = safeTitle ? `<div>Title: ${safeTitle}</div>` : ''
              return `
                <details class="video-item">
                  <summary>
                    <span>${item.provider}</span>
                    <span class="meta">
                      <span>${safeReason}</span>
                      ${item.status != null ? `<span>${item.status}</span>` : ''}
                    </span>
                  </summary>
                  <div class="body">
                    <div>ID: <code>${item.id}</code></div>
                    ${titleLine}
                    ${videoId}
                    ${status}
                    <div style="margin-top:6px;">${urlLink}</div>
                  </div>
                </details>
              `
            })
            .join('')

        const obsoleteSection = `
          <section class="list-section">
            <h2>Confirmed obsolete <span class="badge">${obsoleteItems.length}</span></h2>
            ${
              obsoleteItems.length
                ? `<div class="video-list">${renderItems(obsoleteItems)}</div>`
                : '<p class="note">No confirmed obsolete videos.</p>'
            }
          </section>
        `

        const rateLimitedSection = `
          <section class="list-section rate-limited">
            <h2>HTTP 429 (rate limited) <span class="badge">${rateLimitedItems.length}</span></h2>
            <p class="note">These URLs returned HTTP 429 (Too Many Requests). Wait before retrying or deleting them.</p>
            ${
              rateLimitedItems.length
                ? `<div class="video-list">${renderItems(rateLimitedItems)}</div>`
                : ''
            }
          </section>
        `

        const ambiguousSection = `
          <section class="list-section ambiguous">
            <h2>Ambiguous / network errors <span class="badge">${ambiguousItems.length}</span></h2>
            <p class="note">These failed because of network errors (timeouts, 5xx). Keep them for a later scan.</p>
            ${
              ambiguousItems.length
                ? `<div class="video-list">${renderItems(ambiguousItems)}</div>`
                : ''
            }
          </section>
        `

        if (!obsoleteItems.length && !rateLimitedItems.length && !ambiguousItems.length) {
          listEl.innerHTML = ''
          return
        }
        listEl.innerHTML = `${obsoleteSection}${ambiguousSection}${rateLimitedSection}`
      }

      async function scanVideos() {
        if (!adminKey) {
          alert('Missing admin ingest key.')
          return false
        }
        setBusy(true)
        lastResult = null
        summaryEl.classList.add('hidden')
        listEl.innerHTML = ''
        try {
          const res = await fetch(`/api/tools/videos/obsolete?full=1`, {
            method: 'GET',
            headers: { 'x-admin-ingest-key': adminKey },
          })
          if (!res.ok) {
            const data = await res.json().catch(() => ({}))
            throw new Error(data?.error || res.statusText)
          }
          if (!res.body) {
            throw new Error('Streaming response not available.')
          }

          const reader = res.body.getReader()
          const decoder = new TextDecoder()
          let buffer = ''
          let completed = false

          while (true) {
            const { value, done } = await reader.read()
            if (done) break
            buffer += decoder.decode(value, { stream: true })
            let newlineIndex = buffer.indexOf('\n')
            while (newlineIndex !== -1) {
              const line = buffer.slice(0, newlineIndex).trim()
              buffer = buffer.slice(newlineIndex + 1)
              if (line) {
                const payload = JSON.parse(line)
                if (payload.type === 'progress') {
                  const progressMessage =
                    payload.errors && payload.errors > 0
                      ? `Scanning… ${payload.checked} checked (${payload.errors} errors)`
                      : `Scanning… ${payload.checked} checked`
                  statusEl.textContent = progressMessage
                } else if (payload.type === 'done') {
                  completed = true
                  const counts = normalizeCounts(payload.counts)
                  const result = {
                    checked: payload.checked || 0,
                    errors: payload.errors || 0,
                    durationMs: payload.durationMs || 0,
                    obsolete: Array.isArray(payload.obsolete) ? payload.obsolete : [],
                    rateLimited: Array.isArray(payload.rateLimited) ? payload.rateLimited : [],
                    ambiguous: Array.isArray(payload.ambiguous) ? payload.ambiguous : [],
                    counts,
                  }
                  lastResult = result
                  renderSummary(result)
                  renderList(result)
                  updateActionButtons()
                  statusEl.textContent = buildCompletionMessage(result)
                  await reader.cancel()
                  break
                } else if (payload.type === 'error') {
                  throw new Error(payload.message || 'Scan failed.')
                }
              }
              newlineIndex = buffer.indexOf('\n')
            }
            if (completed) break
          }

          if (!completed) {
            const remainder = buffer + decoder.decode()
            const trimmed = remainder.trim()
            if (trimmed) {
              try {
                const payload = JSON.parse(trimmed)
                if (payload.type === 'done') {
                  const counts = normalizeCounts(payload.counts)
                  const result = {
                    checked: payload.checked || 0,
                    errors: payload.errors || 0,
                    durationMs: payload.durationMs || 0,
                    obsolete: Array.isArray(payload.obsolete) ? payload.obsolete : [],
                    rateLimited: Array.isArray(payload.rateLimited) ? payload.rateLimited : [],
                    ambiguous: Array.isArray(payload.ambiguous) ? payload.ambiguous : [],
                    counts,
                  }
                  lastResult = result
                  renderSummary(result)
                  renderList(result)
                  updateActionButtons()
                  statusEl.textContent = buildCompletionMessage(result)
                } else if (payload.type === 'error') {
                  throw new Error(payload.message || 'Scan failed.')
                }
              } catch (error) {
                console.warn('Failed to parse trailing payload', error)
              }
            }
          }

          if (!lastResult) {
            throw new Error('Scan finished without a result.')
          }
          return true
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Error: ${message}`
          lastResult = null
          summaryEl.classList.add('hidden')
          listEl.innerHTML = ''
          return false
        } finally {
          setBusy(false)
        }
      }

      async function deleteVideos() {
        if (!lastResult?.obsolete?.length) return
        if (!adminKey) {
          alert('Missing admin ingest key.')
          return
        }
        const count = lastResult.obsolete.length
        const confirmMessage = `Delete ${count} video${count > 1 ? 's' : ''}? This cannot be undone.`
        if (!window.confirm(confirmMessage)) return

        setBusy(true)
        try {
          const res = await fetch('/api/tools/videos/obsolete', {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'x-admin-ingest-key': adminKey,
            },
            body: JSON.stringify({ ids: lastResult.obsolete.map((item) => item.id) }),
          })
          const data = await res.json()
          if (!res.ok) {
            throw new Error(data?.error || res.statusText)
          }
          const deleted = data?.deleted ?? 0
          statusEl.textContent = `Deleted ${deleted} obsolete video${deleted === 1 ? '' : 's'}.`
          lastResult = null
          summaryEl.classList.add('hidden')
          listEl.innerHTML = ''
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Delete failed: ${message}`
        } finally {
          setBusy(false)
        }
      }

      async function deleteRateLimitedVideos() {
        if (!lastResult?.rateLimited?.length) return
        if (!adminKey) {
          alert('Missing admin ingest key.')
          return
        }
        const count = lastResult.rateLimited.length
        const confirmMessage = `Delete ${count} rate-limited item${count > 1 ? 's' : ''}? They responded with HTTP 429 and may still be valid.`
        if (!window.confirm(confirmMessage)) return

        setBusy(true)
        try {
          const res = await fetch('/api/tools/videos/obsolete', {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'x-admin-ingest-key': adminKey,
            },
            body: JSON.stringify({ ids: lastResult.rateLimited.map((item) => item.id) }),
          })
          const data = await res.json()
          if (!res.ok) {
            throw new Error(data?.error || res.statusText)
          }
          const deleted = data?.deleted ?? 0
          statusEl.textContent = `Deleted ${deleted} rate-limited item${deleted === 1 ? '' : 's'}.`
          lastResult = null
          summaryEl.classList.add('hidden')
          listEl.innerHTML = ''
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          statusEl.textContent = `Delete (429) failed: ${message}`
        } finally {
          setBusy(false)
        }
      }

      scanBtn.addEventListener('click', () => {
        if (!busy) scanVideos()
      })

      deleteBtn.addEventListener('click', () => {
        if (!busy) deleteVideos()
      })

      deleteRateLimitedBtn.addEventListener('click', () => {
        if (!busy) deleteRateLimitedVideos()
      })

      function scheduleAutoScan() {
        setTimeout(() => maybeAutoScan(false), 2000)
        setInterval(() => maybeAutoScan(false), 60000)
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) maybeAutoScan(true)
        })
        window.addEventListener('focus', () => maybeAutoScan(true))
      }

      async function maybeAutoScan(triggeredByVisibility) {
        if (!autoScanToggle || !autoScanToggle.checked) return
        if (busy) return
        if (hasAutoScanToday()) return
        const now = new Date()
        const windowIndex = getAutoWindowIndex(now)
        if (windowIndex === null) return
        const lastWindow = getLastAutoScanWindow()
        if (lastWindow !== null && lastWindow >= windowIndex) return
        const ok = await scanVideos()
        if (ok) markAutoScan(windowIndex)
      }

      updateAutoStatus()
      scheduleAutoScan()
    </script>
  </body>
</html>
